# WiFi awake while connected. With power saving on, the chip sleeps between the access point's beacons and what
# the radio is sent waits for it: the Panel, the Screen page, TCI and the browser remote came in bursts, late. 2 is
# off, for every WiFi profile that does not ask otherwise (the radio's never do), set at each join.
# The background scans while connected are turned off by dispatcher.d/20-wifi-steady: NetworkManager has no
# setting for them
[connection]
wifi.powersave=2

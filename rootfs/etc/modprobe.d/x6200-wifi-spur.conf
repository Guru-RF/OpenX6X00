# X6200 (rtw88, the RTL8723DU): the radio's own clocks put steady lines at 2457.6 MHz (10 x 245.76 MHz) and 2470.6 MHz
# into WiFi channel 11, where its WiFi stalled and dropped; the driver notches them in the WiFi chip's receiver on the
# channels they fall in (buildroot/x6200/rtw88/0002, README.md there). A driver without the option says "unknown
# parameter" and loads as before; the X6100 has no rtw_8723d
options rtw_8723d host_spur_khz=2457600,2470614

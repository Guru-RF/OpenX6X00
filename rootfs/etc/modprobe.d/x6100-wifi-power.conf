# The WiFi drivers' own power saving off, on both radios: each line is for one radio's driver, and the other's
# is never loaded. Read when the driver loads, at the start of the radio.
#
# X6100 (package rtl8723bu-wifi): no leisure power save between beacons (rtw_power_mgnt), no power-down of the radio
# part while not connected (rtw_ips_mode), no USB selective suspend (rtw_enusbss). The package builds the driver
# without power saving already (patch 0001); these keep it so if it is ever built with it.
options 8723bu rtw_power_mgnt=0 rtw_ips_mode=0 rtw_enusbss=0
# X6200 (rtw88, rtw_core): its leisure power save follows NetworkManager's wifi.powersave
# (conf.d/x6100-wifi-steady.conf) and has no option of its own. The deep state of that power save goes off too,
# should a driver update ever give the X6200's chip one (it has none now)
options rtw_core disable_lps_deep=y

# Orig file: build/target/etc/pulse/daemon.conf

daemonize = yes
disallow-exit = yes
exit-idle-time = -1
use-pid-file = yes
enable-shm = no

resample-method = speex-fixed-1
default-sample-rate = 44100
alternate-sample-rate = 48000

# Mono, like the radio audio: Bluetooth headphones then get SBC mono
# (bitpool 31 instead of joint stereo 39), less airtime on the chip that
# WiFi and Bluetooth share, fewer skips. The radio codec keeps its own stereo profile.
default-sample-channels = 1

# RTL8723BU WiFi is driven by 8723bu.ko (package rtl8723bu-wifi).
# rtl8xxxu is still built: delete this file to go back to it.
blacklist rtl8xxxu
# 20 MHz only: at 40 MHz WiFi covered most of the 2.4 GHz band shared with the
# Bluetooth headphones and the A2DP audio skipped more.
# Channel plan 0x0A (world wide 13): 1-11 active, 12-13 passive, so a router on 12 or 13 (common in Europe)
# is found; the default plan left them off and such networks did not show at all
options 8723bu rtw_bw_mode=0 rtw_channel_plan=0x0A

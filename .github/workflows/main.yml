# Builds the SD card images on GitHub, one per radio: this repository (OpenX6X00) is the GUI
# package of gdyuldin's AetherX6100Buildroot (the X6100) and AetherX6200Buildroot (the X6200),
# built from the checkout instead of upstream. buildroot/local-build.sh does the patching and
# the build, here as in the container at home.
name: Build image

# By hand only (Actions > Build image > Run workflow): releases are built
# locally and the images attached by hand; building on every tag only made a
# second copy, took 2 hours and failed now and then.
on:
  workflow_dispatch:

# Write access for the Release step (the default token is read-only)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: x6100
            tree: AetherX6100Buildroot
            out: OpenX6X00-x6100
          - model: x6200
            tree: AetherX6200Buildroot
            out: OpenX6X00-x6200
    defaults:
      run:
        shell: bash

    env:
      X6CI_IMAGES: ${{ matrix.tree }}/build/images
      X6CI_IMG: ${{ matrix.out }}-${{ github.ref_name }}-sdcard.img
      X6CI_BUNDLE: ${{ matrix.out }}-${{ github.ref_name }}-update.tar.gz

    steps:
    # A full buildroot build needs more room than the runner leaves free:
    # drop the SDKs we do not use (the tool cache and the big packages stay)
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - name: check free space
      run: |
        df -h
        pwd

    - name: Checkout GUI
      uses: actions/checkout@v4
      with:
        submodules: true
        path: x6100_gui

    - name: Checkout buildroot
      uses: actions/checkout@v4
      with:
        submodules: true
        repository: gdyuldin/${{ matrix.tree }}
        path: ${{ matrix.tree }}

    # ccache kept between runs, one cache per radio. The cache key carries the time of the
    # run, so every run saves a new one and restores the latest by prefix.
    - name: Prepare ccache timestamp
      id: ccache_cache_timestamp
      shell: cmake -P {0}
      run: |
        string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
        file(APPEND "$ENV{GITHUB_OUTPUT}" "timestamp=${current_date}")

    # Restore here and save right after Build, even when Build fails, so a
    # failed attempt still leaves its compiled work for the next one.
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-${{ matrix.model }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.model }}-ccache-

    # The update bundle a running radio installs by itself (x6100-update) is signed with the
    # repository secret UPDATE_SIGNING_KEY (an EC P-256 private key in PEM; its public half is
    # rootfs/usr/share/x6100/update.pub). Without the secret the bundle is unsigned and radios
    # refuse it. The script also patches the buildroot tree (the X6100's U-Boot: mainline 2026.07,
    # its tarball checked), configures and builds, and names the image <out>-local-sdcard.img.
    - name: Build
      env:
        UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      run: |
        if [ -n "$UPDATE_SIGNING_KEY" ]; then
          printf '%s\n' "$UPDATE_SIGNING_KEY" > /tmp/update-key.pem
          export UPDATE_KEY=/tmp/update-key.pem
        fi
        MODEL=${{ matrix.model }} GUI_DIR=$GITHUB_WORKSPACE/x6100_gui BR_DIR=$GITHUB_WORKSPACE/${{ matrix.tree }} \
          bash x6100_gui/buildroot/local-build.sh
        rm -f /tmp/update-key.pem

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-${{ matrix.model }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}

    # The release names: <out>-<ref>-sdcard.img.zip and <out>-<ref>-update.tar.gz (the script
    # named the bundle after the version in src/main.h)
    - name: Name the image and the bundle
      run: |
        cd $X6CI_IMAGES
        mv ${{ matrix.out }}-local-sdcard.img $X6CI_IMG
        zip $X6CI_IMG.zip $X6CI_IMG
        mv ${{ matrix.out }}-v*-update.tar.gz $X6CI_BUNDLE
        ls -la $X6CI_IMG.zip $X6CI_BUNDLE

    # Always keep the image and the bundle as workflow artifacts: branch runs have no
    # release to attach to, and on a tag they survive a failed Release step.
    - name: Upload image
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.X6CI_IMG }}.zip
        path: ${{ env.X6CI_IMAGES }}/${{ env.X6CI_IMG }}.zip
        retention-days: 30

    - name: Upload update bundle
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.X6CI_BUNDLE }}
        path: ${{ env.X6CI_IMAGES }}/${{ env.X6CI_BUNDLE }}
        retention-days: 30

    # On a tag: GitHub release with the image and the update bundle (what radios look for)
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ${{ env.X6CI_IMAGES }}/${{ env.X6CI_IMG }}.zip
          ${{ env.X6CI_IMAGES }}/${{ env.X6CI_BUNDLE }}
